[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automate"
version = "1.0.0"
description = "Croissance cellulaire stochastique, agrégats critiques et seuil de percolation par Monte Carlo"
authors = [{ name = "Maxime Fruntes" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "pandas>=2.1", "tabulate>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
